services:
  storybook:
    build:
      context: .
      dockerfile: Dockerfile.storybook
    ports:
      - target: 80
        published: "${STORYBOOK_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
        app_protocol: http
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.json"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: "no"
    x-phantom:
      lifecycle: ephemeral
      purpose: "Preview de componentes UI"
      card: "task_8d85ce7b-dc67-4070-832d-24cb80f95a19"
